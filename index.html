<title>Targets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&family=Fira+Sans+Extra+Condensed:wght@600;700&display=swap">
<style>
/* Layout: scoreboard-style app shell — sticky header with tabs, one hero "score" per view, tile grid for one-tap sales */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --sunk: #e3e6ee;
  --ink: #12151c;
  --muted: #5d6475;
  --line: #d4d8e2;
  --accent: #2346f0;
  --accent-ink: #ffffff;
  --accent-soft: #dfe5ff;
  --energy: #f2622a;
  --good: #14894e;
  --good-soft: #d7f2e3;
  --warn: #b25b00;
  --warn-soft: #fdebd3;
  --c0: #2346f0; --c1: #d9431e; --c2: #0f8a63; --c3: #9a3ccf; --c4: #c08a00; --c5: #0b84b5;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --num: "Fira Sans Extra Condensed", "Arial Narrow", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1017; --surface: #161b25; --sunk: #1f2532; --ink: #eef1f7; --muted: #9aa3b6; --line: #2b3242;
    --accent: #7189ff; --accent-ink: #0d1017; --accent-soft: #232c52; --energy: #ff8656;
    --good: #45c987; --good-soft: #15352a; --warn: #f0a650; --warn-soft: #3a2a14;
    --c0: #7189ff; --c1: #ff7f5c; --c2: #3fcf9b; --c3: #c58bff; --c4: #f0c341; --c5: #4cc3f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1017; --surface: #161b25; --sunk: #1f2532; --ink: #eef1f7; --muted: #9aa3b6; --line: #2b3242;
  --accent: #7189ff; --accent-ink: #0d1017; --accent-soft: #232c52; --energy: #ff8656;
  --good: #45c987; --good-soft: #15352a; --warn: #f0a650; --warn-soft: #3a2a14;
  --c0: #7189ff; --c1: #ff7f5c; --c2: #3fcf9b; --c3: #c58bff; --c4: #f0c341; --c5: #4cc3f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; display: grid; gap: 10px; }
.brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.pulse { width: 24px; height: 24px; color: var(--energy); }
.whoami { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.whoami select { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; color: var(--ink); max-width: 180px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 10px 14px; border-bottom: 3px solid transparent; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }

main { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 110px; display: grid; gap: 18px; }
.banner { border-radius: var(--radius); padding: 10px 14px; font-size: 14px; background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner b { color: var(--warn); }
h2 { font-family: var(--display); font-weight: 600; font-size: 16px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

/* Hero scoreboard */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 680px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.score { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.score .big { font-family: var(--num); font-weight: 700; font-size: 84px; line-height: 0.9; letter-spacing: -0.02em; }
.score .of { font-family: var(--num); font-weight: 600; font-size: 34px; color: var(--muted); }
.score .unit { color: var(--muted); font-size: 14px; margin-left: 4px; }
.bar { height: 12px; background: var(--sunk); border-radius: 999px; overflow: hidden; margin-top: 12px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.bar.done > i { background: var(--good); }
.bar.thin { height: 6px; margin-top: 6px; }
.hint { margin: 10px 0 0; font-weight: 500; }
.hint.done { color: var(--good); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; }
.stat { background: var(--sunk); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-family: var(--num); font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat.wide { grid-column: 1 / -1; background: var(--accent-soft); }
.stat.wide .v { color: var(--accent); font-size: 22px; }

.team { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); display: grid; gap: 8px; }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.team-row .bar { grid-column: 1 / -1; margin-top: 0; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--cc, var(--c0)) 16%, transparent); color: var(--ink); white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cc, var(--c0)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.seller { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Product tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; min-height: 128px; align-content: start; position: relative; transition: transform .08s ease, border-color .15s; }
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(0.97); }
.tile .name { font-weight: 700; font-size: 16px; line-height: 1.2; padding-right: 54px; }
.tile .price { font-size: 13px; color: var(--muted); }
.tile .bonus { position: absolute; top: 12px; right: 12px; font-family: var(--num); font-weight: 700; font-size: 15px; color: var(--energy); }
.tile .prog { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tile .prog b { color: var(--ink); font-family: var(--num); font-size: 16px; }
.tile.hit .prog b { color: var(--good); }
.tile .plus { font-family: var(--display); font-size: 12px; color: var(--accent); font-weight: 600; }
.tile[disabled] { opacity: .5; cursor: not-allowed; }

.list { display: grid; gap: 0; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li time { font-family: var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 8px; }
.x:hover { background: var(--sunk); color: var(--ink); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary[disabled] { opacity: .45; cursor: default; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--energy); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Leaderboard */
.contest { border-radius: 20px; padding: 18px 20px; background: var(--ink); color: var(--bg); display: grid; gap: 4px; }
.contest .t { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }
.contest .p { font-weight: 600; color: color-mix(in srgb, var(--energy) 80%, var(--bg)); }
.board { display: grid; gap: 8px; }
.rank { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.rank .pos { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--muted); text-align: center; }
.rank.r1 { border-color: var(--energy); }
.rank.r1 .pos { color: var(--energy); }
.rank.r2 .pos, .rank.r3 .pos { color: var(--ink); }
.rank .who { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.rank .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .main { font-family: var(--num); font-weight: 700; font-size: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.rank .sub { grid-column: 2 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.rank .bar { grid-column: 2 / -1; margin-top: 2px; }
.rank.me { box-shadow: inset 4px 0 0 var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cc, var(--c0)); flex: none; }

/* Schedule */
.week-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.week-nav .label { font-weight: 700; min-width: 150px; text-align: center; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.day.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; }
.day-h b { font-family: var(--display); font-weight: 600; font-size: 14px; }
.shift { background: var(--sunk); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; }
.shift .time { font-family: var(--num); font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.empty-day { color: var(--muted); font-size: 13px; }
.stype { justify-self: start; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 2px 8px; border-radius: 6px; background: var(--surface); color: var(--muted); }
.stype-morning { color: var(--c4); }
.stype-evening { color: var(--accent); }
.stype-double { background: var(--energy); color: var(--surface); }

/* Forms */
.form { display: grid; gap: 10px; background: var(--sunk); border-radius: 10px; padding: 10px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field select, .tbl input { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; min-width: 620px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 6px; text-transform: uppercase; letter-spacing: .05em; }
.tbl td { padding: 4px 6px; }
.tbl td:first-child input { min-width: 180px; }
.tbl td.n input { min-width: 64px; text-align: right; font-family: var(--num); font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar-in { max-width: 980px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.steps { display: grid; gap: 10px; counter-reset: s; margin: 10px 0 0; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; color: var(--accent); min-width: 18px; }
.pickme { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.pickme button { padding: 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.pickme button:hover { border-color: var(--accent); }

.toast { position: fixed; left: 50%; width: max-content; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); font-weight: 500; }
.toast button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 700; }
.celebrate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); padding: 16px; }
.celebrate .box { background: var(--surface); border: 2px solid var(--good); border-radius: 22px; padding: 26px 28px; text-align: center; max-width: 380px; display: grid; gap: 8px; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
.celebrate .box b { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--good); }
.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .celebrate .box { animation: none; } .bar > i { transition: none; } .tile { transition: none; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand">
        <svg class="pulse" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="9.5" stroke="currentColor" stroke-width="2.2"/><circle cx="11" cy="11" r="5" stroke="currentColor" stroke-width="2.2"/><circle cx="11" cy="11" r="1.6" fill="currentColor"/></svg>
        Targets
      </div>
      <label class="whoami" for="me-select">Аз съм
        <select id="me-select"></select>
      </label>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="app"></main>
<div id="savebar-slot"></div>
<div id="toast-slot"></div>
<div id="celebrate-slot"></div>

<script>
(() => {
  // ---------- helpers ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => (Math.round((n || 0) * 100) / 100).toFixed(2).replace(".", ",") + " €";
  const rid = () => Math.random().toString(36).slice(2, 9);
  const WD = ["Нед", "Пон", "Вт", "Ср", "Чет", "Пет", "Съб"];
  const MONTHS = ["януари", "февруари", "март", "април", "май", "юни", "юли", "август", "септември", "октомври", "ноември", "декември"];
  const dm = s => { const d = parse(s); return `${d.getDate()}.${pad(d.getMonth() + 1)}`; };
  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const TODAY = ymd(new Date());
  const MONTH = TODAY.slice(0, 7);
  const MONTH_START = MONTH + "-01";
  const monthEnd = (() => { const d = parse(MONTH_START); d.setMonth(d.getMonth() + 1); d.setDate(0); return ymd(d); })();
  const PREV_MONTH_START = (() => { const d = parse(MONTH_START); d.setMonth(d.getMonth() - 1); return ymd(d); })();

  const TEMPLATE = [
    { name: "Протеинов шейк", price: 4.5, bonus: 0.5, targets: { morning: 2, evening: 4, double: 5 } },
    { name: "Протеиново блокче", price: 3, bonus: 0.3, targets: { morning: 3, evening: 3, double: 5 } },
    { name: "Енергийна напитка", price: 3.5, bonus: 0.3, targets: { morning: 1, evening: 3, double: 4 } },
    { name: "Персонална тренировка", price: 35, bonus: 5, targets: {} },
    { name: "Месечна карта", price: 60, bonus: 6, targets: {} },
    { name: "Вода", price: 1.5, bonus: 0.1, targets: {} }
  ];
  const SHIFT_TYPES = [
    { id: "morning", name: "Сутрешна", start: "07:00", end: "14:30" },
    { id: "evening", name: "Вечерна", start: "14:30", end: "22:00" },
    { id: "double", name: "Дублажна", start: "07:00", end: "22:00" }
  ];
  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- state ----------
  const state = {
    mode: "demo",           // demo | live | offline
    cfg: null, shifts: [], sales: [],
    me: store.get("smena.me"),
    seller: null,
    manager: false, canWrite: true,
    tab: "shift", weekOffset: 0,
    draft: null, dirty: false,
    editingShift: null,
    celebrated: store.get("smena.celebrated") || ""
  };
  let DB = null, salesFrom = null, unsubSales = null;

  function emptyCfg() { return { products: [], staff: [], shiftTypes: clone(SHIFT_TYPES), contest: { on: false, title: "", prize: "", metric: "pct", from: MONTH_START, to: monthEnd } }; }
  function normCfg(c) {
    const e = emptyCfg();
    const shiftTypes = Array.isArray(c?.shiftTypes) && c.shiftTypes.length ? c.shiftTypes : e.shiftTypes;
    // Older saves had one number per product; it becomes the goal for every shift type.
    const products = (Array.isArray(c?.products) ? c.products : []).map(p => {
      if (p.targets) return p;
      const targets = {};
      if (p.target > 0) for (const t of shiftTypes) targets[t.id] = p.target;
      const { target, ...rest } = p;
      return { ...rest, targets };
    });
    return {
      products,
      staff: Array.isArray(c?.staff) ? c.staff : [],
      shiftTypes,
      contest: { ...e.contest, ...(c?.contest || {}) }
    };
  }

  // ---------- demo data (examples only, never written to the store) ----------
  function makeDemo() {
    const products = TEMPLATE.map((p, i) => ({ id: "p" + i, ...p }));
    const staff = [{ id: "s1", name: "Ани", color: 0 }, { id: "s2", name: "Иво", color: 1 }, { id: "s3", name: "Мира", color: 2 }];
    const shifts = [], sales = [];
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let d = PREV_MONTH_START; d <= monthEnd; d = addDays(d, 1)) {
      const k = parse(d).getDate();
      if (parse(d).getDay() === 0) {
        shifts.push({ id: "d" + d, date: d, type: "double", start: "07:00", end: "22:00", staff: [k % 2 ? "s1" : "s3"] });
        continue;
      }
      shifts.push({ id: "m" + d, date: d, type: "morning", start: "07:00", end: "14:30", staff: k % 3 === 0 ? ["s1", "s2"] : ["s1"] });
      shifts.push({ id: "e" + d, date: d, type: "evening", start: "14:30", end: "22:00", staff: k % 2 === 0 ? ["s2", "s3"] : ["s3"] });
    }
    const skill = { s1: 1.1, s2: 0.75, s3: 0.95 };
    for (const sh of shifts) {
      if (sh.date < MONTH_START || sh.date > TODAY) continue;
      const part = sh.date === TODAY ? 0.45 : 1;
      for (const sid of sh.staff) for (const p of products) {
        const t = p.targets[sh.type] || 0;
        const exp = (t ? t * 1.1 : 0.35) * skill[sid] * part;
        const n = Math.floor(exp + rnd() * 1.2 - 0.3);
        for (let i = 0; i < n; i++) sales.push({ id: rid(), date: sh.date, ts: 0, time: sh.start, staffId: sid, productId: p.id, qty: 1, price: p.price, bonus: p.bonus });
      }
    }
    return { cfg: { products, staff, shiftTypes: clone(SHIFT_TYPES), contest: { on: true, title: "Есенен шампионат", prize: "Ваучер за 50 € и почивен уикенд", metric: "pct", from: MONTH_START, to: monthEnd } }, shifts, sales };
  }
  function loadDemo() {
    const d = makeDemo();
    state.cfg = d.cfg; state.shifts = d.shifts; state.sales = d.sales;
    if (!state.cfg.staff.some(s => s.id === state.me)) state.me = "s1";
  }

  // ---------- derived ----------
  const prod = id => state.cfg.products.find(p => p.id === id);
  const person = id => state.cfg.staff.find(s => s.id === id);
  const activeStaff = () => state.cfg.staff.filter(s => !s.archived);
  const colorOf = id => { const s = person(id); return `var(--c${(s?.color ?? 0) % 6})`; };
  const chip = id => `<span class="chip" style="--cc:${colorOf(id)}">${esc(person(id)?.name || "Бивш колега")}</span>`;

  function salesBy(sid, from, to, pid) {
    let q = 0, b = 0;
    for (const s of state.sales) {
      if (s.staffId !== sid || s.date < from || s.date > to) continue;
      if (pid && s.productId !== pid) continue;
      q += s.qty || 1; b += (s.bonus || 0) * (s.qty || 1);
    }
    return { qty: q, bonus: b };
  }

  const shiftType = id => state.cfg.shiftTypes.find(t => t.id === id);
  // The manager sets each product's goal per person for each shift type.
  // A person's goal for a day is the sum over the shifts they work that day.
  function goalsForDay(sid, date) {
    const by = {}; let total = 0;
    for (const sh of state.shifts) {
      if (sh.date !== date || !(sh.staff || []).includes(sid)) continue;
      for (const p of state.cfg.products) {
        const n = +(p.targets || {})[sh.type] || 0;
        if (n <= 0) continue;
        by[p.id] = (by[p.id] || 0) + n; total += n;
      }
    }
    return { by, total };
  }
  function progressOn(sid, goals, date) {
    let done = 0;
    for (const pid in goals.by) done += Math.min(salesBy(sid, date, date, pid).qty, goals.by[pid]);
    return done;
  }
  const todayProgress = (sid, goals) => progressOn(sid, goals, TODAY);
  function bonusLeft(sid, goals) {
    let eur = 0;
    for (const pid in goals.by) eur += Math.max(0, goals.by[pid] - salesBy(sid, TODAY, TODAY, pid).qty) * (prod(pid)?.bonus || 0);
    return eur;
  }
  function workedDays(sid, from, to) {
    const ds = new Set();
    for (const s of state.shifts) if ((s.staff || []).includes(sid) && s.date >= from && s.date <= to && s.date <= TODAY) ds.add(s.date);
    return [...ds].sort();
  }
  function monthStats(sid, from = MONTH_START, to = monthEnd) {
    let tgt = 0, hit = 0, met = 0, shifts = 0, streak = 0;
    for (const d of workedDays(sid, from, to)) {
      const g = goalsForDay(sid, d);
      if (!g.total) continue;
      const done = progressOn(sid, g, d);
      // Today's shift is still running: it only counts once its goal is met.
      if (d === TODAY && done < g.total) continue;
      shifts++; tgt += g.total; hit += done;
      if (done >= g.total) { met++; streak++; } else streak = 0;
    }
    const all = salesBy(sid, from, to);
    return { qty: all.qty, bonus: all.bonus, pct: tgt ? hit / tgt : null, met, shifts, streak };
  }
  function myShiftToday(sid) {
    const t = nowHM();
    const mine = state.shifts.filter(s => s.date === TODAY && (s.staff || []).includes(sid)).sort((a, b) => a.start.localeCompare(b.start));
    return mine.find(s => s.start <= t && t < s.end) || mine.find(s => t < s.end) || mine[mine.length - 1] || null;
  }

  // ---------- data layer ----------
  async function addSale(rec) {
    if (state.mode !== "live") { rec.id = rid(); state.sales.push(rec); render(); return rec.id; }
    const ref = DB.collection("sales").doc();
    await ref.set(rec);
    return ref.id;
  }
  async function deleteSale(id) {
    if (state.mode !== "live") { state.sales = state.sales.filter(s => s.id !== id); render(); return; }
    await DB.doc("sales/" + id).delete();
  }
  async function saveCfg(cfg) {
    if (state.mode !== "live") { state.cfg = JSON.parse(JSON.stringify(cfg)); render(); return; }
    await DB.doc("cfg/main").set(cfg);
  }
  async function saveShift(sh) {
    const body = { date: sh.date, type: sh.type, start: sh.start, end: sh.end, staff: sh.staff };
    if (state.mode !== "live") {
      const i = state.shifts.findIndex(s => s.id === sh.id);
      if (i >= 0) state.shifts[i] = { id: sh.id, ...body }; else state.shifts.push({ id: rid(), ...body });
      render(); return;
    }
    const col = DB.collection("cfg/main/shifts");
    await (sh.id ? col.doc(sh.id) : col.doc()).set(body);
  }
  async function deleteShift(id) {
    if (state.mode !== "live") { state.shifts = state.shifts.filter(s => s.id !== id); render(); return; }
    await DB.doc("cfg/main/shifts/" + id).delete();
  }
  function writeFailed(e) {
    if (e?.code === "invalid_argument") { state.canWrite = false; render(); toast("Нямаш права да записваш тук. Помоли мениджъра да те добави като редактор."); }
    else if (e?.code === "quota_exceeded") toast("Базата е пълна. Мениджърът трябва да изтрие стари записи.");
    else toast("Не успях да запиша. Провери връзката и опитай пак.");
  }

  // ---------- fireworks ----------
  const fx = (() => {
    const cv = document.createElement("canvas");
    cv.className = "fx"; cv.setAttribute("aria-hidden", "true");
    document.body.appendChild(cv);
    const ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let parts = [], raf = 0;
    function size() {
      const r = devicePixelRatio || 1;
      cv.width = innerWidth * r; cv.height = innerHeight * r;
      ctx.setTransform(r, 0, 0, r, 0, 0);
    }
    const colors = () => {
      const cs = getComputedStyle(document.documentElement);
      return ["--energy", "--accent", "--good", "--c3", "--c4", "--c5"].map(v => cs.getPropertyValue(v).trim());
    };
    function burst(x, y, n, power) {
      const cols = colors();
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = power * (0.35 + Math.random() * 0.85);
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.011 + Math.random() * 0.014, c: cols[i % cols.length], r: 1.8 + Math.random() * 2.4 });
      }
      if (!raf) { size(); raf = requestAnimationFrame(tick); }
    }
    function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life > 0);
      for (const p of parts) {
        p.vx *= 0.975; p.vy = p.vy * 0.975 + 0.11;
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = parts.length ? requestAnimationFrame(tick) : 0;
      if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
    }
    const sky = (delay, n, power) => setTimeout(() => burst(innerWidth * (0.12 + Math.random() * 0.76), innerHeight * (0.15 + Math.random() * 0.3), n, power), delay);
    return {
      sale(el) {
        if (reduce.matches) return;
        const r = el?.getBoundingClientRect();
        burst(r ? r.left + r.width / 2 : innerWidth / 2, r ? r.top + r.height / 2 : innerHeight / 2, 55, 5.5);
        sky(160, 80, 6.5);
        sky(420, 70, 6);
      },
      big() {
        if (reduce.matches) return;
        for (let i = 0; i < 9; i++) sky(i * 240, 100, 7.5);
      }
    };
  })();

  // ---------- toast & celebration ----------
  let toastTimer = null;
  function toast(msg, undo) {
    const slot = document.getElementById("toast-slot");
    slot.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? `<button type="button" id="undo-btn">Отмени</button>` : ""}</div>`;
    if (undo) document.getElementById("undo-btn").onclick = () => { slot.innerHTML = ""; undo(); };

  // ---------- views ----------
  const TABS = [["shift", "Смяна"], ["board", "Класация"], ["schedule", "График"], ["manage", "Управление"]];

  function viewShift() {
    const c = state.cfg;
    if (!c.products.length || !activeStaff().length) {
      if (state.manager) return `<section class="card"><h2>Да настроим екипа</h2><p class="muted">Три стъпки и колегите могат да започнат.</p><ol class="steps"><li>Добави продуктите и услугите с цена, бонус и цел за всеки вид смяна.</li><li>Добави колегите от рецепцията.</li><li>Сложи смените в графика.</li></ol><div class="row" style="margin-top:14px"><a class="btn primary" href="#manage">Към управлението</a></div></section>`;
      return `<section class="card"><h2>Още няма продукти и екип</h2><p class="muted">Мениджърът трябва първо да добави продуктите и колегите. После тук ще видиш целта си за смяната.</p></section>`;
    }
    if (!person(state.me) || person(state.me).archived) {
      return `<section class="card"><h2>Кой си ти?</h2><p class="muted">Избери името си. Телефонът ще го запомни.</p><div class="pickme">${activeStaff().map(s => `<button type="button" data-act="pick" data-id="${esc(s.id)}"><span class="dot" style="--cc:${colorOf(s.id)}"></span>${esc(s.name)}</button>`).join("")}</div></section>`;
    }
    const me = state.me;
    const sh = myShiftToday(me);
    const members = sh ? sh.staff.filter(id => person(id)) : [me];
    if (!members.includes(state.seller)) state.seller = members.includes(me) ? me : members[0];
    const g = goalsForDay(me, TODAY);
    const done = todayProgress(me, g);
    const pct = g.total ? Math.min(1, done / g.total) : 0;
    const ms = monthStats(me);
    const eurLeft = bonusLeft(me, g);
    const todayB = salesBy(me, TODAY, TODAY).bonus;
    const partners = members.filter(id => id !== me);
    const shiftLine = sh ? `${esc(shiftType(sh.type)?.name || "Смяна")} ${sh.start}–${sh.end}${partners.length ? " · с " + partners.map(id => esc(person(id).name)).join(", ") : " · сам/а"}` : "Днес нямаш смяна в графика";

    let team = "";
    if (partners.length) {
      let tg = 0, td = 0;
      const rows = members.map(id => { const gg = goalsForDay(id, TODAY), dd = todayProgress(id, gg); tg += gg.total; td += dd; return { id, gg, dd }; });
      team = `<div class="team"><div class="sec-head"><span class="eyebrow">Обща цел на смяната</span><span class="num" style="font-size:20px;font-weight:700">${td} / ${tg}</span></div>
        <div class="bar ${td >= tg ? "done" : ""}"><i style="width:${tg ? Math.min(100, td / tg * 100) : 0}%"></i></div>
        ${rows.map(r => `<div class="team-row">${chip(r.id)}<span class="num">${r.dd} / ${r.gg.total}</span><div class="bar thin ${r.dd >= r.gg.total ? "done" : ""}"><i style="width:${r.gg.total ? Math.min(100, r.dd / r.gg.total * 100) : 0}%"></i></div></div>`).join("")}</div>`;
    }

    const remaining = Math.max(0, g.total - done);
    const hint = !sh ? "Без смяна в графика няма цел, но продажбите и бонусът пак се записват."
      : !g.total ? "Мениджърът още не е задал цел за този вид смяна."
      : remaining === 0 ? "Целта за смяната е изпълнена. Продължавай, бонусът расте." : `Още ${remaining} ${remaining === 1 ? "продажба" : "продажби"} до целта за смяната.`;

    const sellerCtl = members.length > 1 ? `<div class="seller"><span class="eyebrow">Кой продаде?</span>${members.map(id => `<button type="button" class="seg" data-act="seller" data-id="${esc(id)}" aria-pressed="${id === state.seller}">${esc(person(id).name)}</button>`).join("")}</div>` : "";
    const sg = state.seller === me ? g : goalsForDay(state.seller, TODAY);
    const tiles = c.products.map(p => {
      const n = salesBy(state.seller, TODAY, TODAY, p.id).qty;
      const goal = sg.by[p.id];
      const hit = goal !== undefined && n >= goal;
      return `<button type="button" class="tile ${hit ? "hit" : ""}" data-act="sell" data-id="${esc(p.id)}" ${state.canWrite ? "" : "disabled"}>
        <span class="bonus">+${money(p.bonus)}</span>
        <span class="name">${esc(p.name)}</span>
        <span class="price">${money(p.price)}</span>
        <span class="prog"><span>${goal !== undefined ? `днес <b>${n}</b> / ${goal}` : `днес <b>${n}</b>`}</span><span class="plus">+1</span></span>
      </button>`;
    }).join("");

    const recent = state.sales.filter(s => s.date === TODAY && members.includes(s.staffId)).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 8);
    const recentHtml = recent.length ? recent.map(s => `<div class="li"><time>${esc(s.time || "")}</time>${chip(s.staffId)}<span class="grow">${esc(prod(s.productId)?.name || "Изтрит продукт")}</span><span class="num">+${money((s.bonus || 0) * (s.qty || 1))}</span>${state.canWrite && (s.staffId === me || state.manager) ? `<button class="x" type="button" title="Изтрий" aria-label="Изтрий" data-act="unsell" data-id="${esc(s.id)}">×</button>` : ""}</div>`).join("") : `<p class="muted" style="margin:0">Още няма продажби днес. Първата е най-трудна.</p>`;

        <div class="bar ${g.total && done >= g.total ? "done" : ""}"><i style="width:${(g.total ? pct : 1) * 100}%"></i></div>
        <p class="hint ${remaining === 0 ? "done" : ""}">${hint}</p>

      </div>

        <div class="stat"><div class="v">${money(todayB)}</div><div class="k">бонус днес</div></div>
        <div class="stat"><div class="v">${money(ms.bonus)}</div><div class="k">бонус за ${MONTHS[parse(TODAY).getMonth()]}</div></div>
        <div class="stat"><div class="v">${ms.met} от ${ms.shifts}</div><div class="k">смени с изпълнена цел</div></div>

      </div>

    <section style="display:grid;gap:12px">
      <div class="sec-head"><h2>Продадох</h2><span class="muted" style="font-size:13px">Едно докосване = 1 бр.</span></div>
      ${sellerCtl}

    <section class="card"><div class="sec-head" style="margin-bottom:6px"><h2>Днешни продажби</h2></div><div class="list">${recentHtml}</div></section>`;
  }

  }

  function weekStart(offset) {
    const d = parse(TODAY); const wd = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - wd + offset * 7); return ymd(d);
  }

  function shiftForm(e) {
    return `<div class="form">
      <div class="field">Вид смяна<div class="row" style="gap:6px">${state.cfg.shiftTypes.map(t => `<button type="button" class="seg" data-act="sf-type" data-id="${esc(t.id)}" aria-pressed="${e.type === t.id}">${esc(t.name)}</button>`).join("")}</div></div>
      <div class="grid2" style="grid-template-columns:1fr 1fr">
        <label class="field" for="sf-start">Начало<input id="sf-start" type="time" value="${esc(e.start)}" data-sf="start"></label>
        <label class="field" for="sf-end">Край<input id="sf-end" type="time" value="${esc(e.end)}" data-sf="end"></label>
      </div>
      <div class="field">Кой е на смяна<div class="checks">${activeStaff().map(s => `<label><input type="checkbox" data-sfstaff="${esc(s.id)}" ${e.staff.includes(s.id) ? "checked" : ""}>${esc(s.name)}</label>`).join("") || `<span class="muted">Първо добави колеги в Управление.</span>`}</div></div>
      <div class="row"><button class="btn primary small" type="button" data-act="shift-save" ${e.staff.length && e.start < e.end && shiftType(e.type) ? "" : "disabled"}>Запази смяната</button><button class="btn small" type="button" data-act="shift-cancel">Откажи</button></div>
    </div>`;
  }

  function viewSchedule() {
    const ws = weekStart(state.weekOffset);
    const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
    const prevWeek = state.shifts.filter(s => s.date >= addDays(ws, -7) && s.date < ws);
    const thisWeek = state.shifts.filter(s => s.date >= ws && s.date <= days[6]);
    const ed = state.editingShift;
    const m = state.manager && state.mode !== "demo";
    const canBack = state.weekOffset > -4;
    return `<div class="sec-head"><h2>График на смените</h2>
      <div class="week-nav"><button class="btn small" type="button" data-act="week" data-id="-1" ${canBack ? "" : "disabled"} aria-label="Предишна седмица">←</button><span class="label">${dm(days[0])} – ${dm(days[6])}</span><button class="btn small" type="button" data-act="week" data-id="1" aria-label="Следваща седмица">→</button>${state.weekOffset ? `<button class="btn small" type="button" data-act="week" data-id="0">Тази седмица</button>` : ""}</div></div>
      ${m && !thisWeek.length && prevWeek.length ? `<div class="banner" style="background:var(--accent-soft);border-color:transparent">Седмицата е празна. <button class="btn small primary" type="button" data-act="copy-week" style="margin-left:8px">Копирай смените от миналата седмица</button></div>` : ""}
      <section class="days">${days.map(d => {
        const list = state.shifts.filter(s => s.date === d).sort((a, b) => a.start.localeCompare(b.start));
        const dd = parse(d);
        return `<div class="day ${d === TODAY ? "today" : ""}">
          <div class="day-h"><b>${WD[dd.getDay()]} ${dm(d)}</b>${d === TODAY ? `<span class="eyebrow" style="color:var(--accent)">днес</span>` : ""}</div>
          ${list.map(s => ed && ed.id === s.id ? shiftForm(ed) : `<div class="shift"><span class="stype stype-${esc(s.type || "")}">${esc(shiftType(s.type)?.name || "Без вид")}</span><div class="time"><span>${esc(s.start)} – ${esc(s.end)}</span>${m ? `<span class="row" style="gap:2px"><button class="btn small" type="button" data-act="shift-edit" data-id="${esc(s.id)}">Промени</button><button class="x" type="button" aria-label="Изтрий смяната" title="Изтрий" data-act="shift-del" data-id="${esc(s.id)}">×</button></span>` : ""}</div><div class="chips">${(s.staff || []).map(chip).join("")}</div></div>`).join("") || (ed && !ed.id && ed.date === d ? "" : `<span class="empty-day">Няма смени</span>`)}
          ${ed && !ed.id && ed.date === d ? shiftForm(ed) : ""}
          ${m && !(ed && ed.date === d) ? `<button class="btn small" type="button" data-act="shift-add" data-id="${d}">+ Смяна</button>` : ""}
        </div>`;
      }).join("")}</section>
      ${state.mode === "demo" ? "" : !state.manager ? `<p class="muted" style="font-size:13px;margin:0">Графика го попълва мениджърът.</p>` : ""}`;
  }

  function viewManage() {
    if (!state.manager) return `<section class="card"><h2>Само за мениджъра</h2></section>`;
    if (!state.dirty || !state.draft) state.draft = JSON.parse(JSON.stringify(state.cfg));
    const d = state.draft;
    const k = d.contest;
    const types = d.shiftTypes;
    return `<section class="card" style="display:grid;gap:12px">
        <div class="sec-head"><h2>Продукти и услуги</h2>${d.products.length ? "" : `<button class="btn small" type="button" data-act="template">Добави примерни за фитнес</button>`}</div>
        <p class="muted" style="margin:0;font-size:14px">Бонусът е сумата, която колегата печели за всяка продадена бройка. Целите са колко бройки трябва да продаде всеки колега за една смяна от съответния вид. Когато двама са на смяна заедно, всеки има своя цел, а общата е сборът. Остави 0, ако продуктът няма цел за тази смяна.</p>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th rowspan="2">Име</th><th rowspan="2" style="text-align:right">Цена €</th><th rowspan="2" style="text-align:right">Бонус € / бр.</th><th colspan="${types.length}" style="text-align:center">Цел бр. за смяна</th><th rowspan="2"></th></tr>
          <tr>${types.map(t => `<th style="text-align:right">${esc(t.name)}</th>`).join("")}</tr></thead><tbody>
        ${d.products.map((p, i) => `<tr>
          <td><input id="p-${esc(p.id)}-name" aria-label="Име" value="${esc(p.name)}" data-path="products.${i}.name"></td>
          <td class="n"><input id="p-${esc(p.id)}-price" aria-label="Цена" type="number" min="0" step="0.1" value="${p.price}" data-path="products.${i}.price" data-num></td>
          <td class="n"><input id="p-${esc(p.id)}-bonus" aria-label="Бонус" type="number" min="0" step="0.05" value="${p.bonus}" data-path="products.${i}.bonus" data-num></td>
          ${types.map(t => `<td class="n"><input id="p-${esc(p.id)}-t-${esc(t.id)}" aria-label="Цел за ${esc(t.name)} смяна" type="number" min="0" step="1" value="${+(p.targets || {})[t.id] || 0}" data-path="products.${i}.targets.${esc(t.id)}" data-num></td>`).join("")}
          <td><button class="x" type="button" aria-label="Премахни" title="Премахни" data-act="prod-del" data-id="${i}">×</button></td></tr>`).join("")}
        </tbody></table></div>
        <div><button class="btn small" type="button" data-act="prod-add">+ Продукт</button></div>
      </section>
      <section class="card" style="display:grid;gap:12px">
        <h2>Видове смени</h2>
        <p class="muted" style="margin:0;font-size:14px">Часовете се попълват сами, когато слагаш смяна в графика. После може да ги промениш за конкретния ден.</p>
        <div class="tbl-wrap"><table class="tbl" style="min-width:420px"><thead><tr><th>Име</th><th>Начало</th><th>Край</th><th></th></tr></thead><tbody>
        ${types.map((t, i) => `<tr>
          <td><input id="t-${esc(t.id)}-name" aria-label="Име на смяната" value="${esc(t.name)}" data-path="shiftTypes.${i}.name"></td>
          <td><input id="t-${esc(t.id)}-start" aria-label="Начало" type="time" value="${esc(t.start)}" data-path="shiftTypes.${i}.start"></td>
          <td><input id="t-${esc(t.id)}-end" aria-label="Край" type="time" value="${esc(t.end)}" data-path="shiftTypes.${i}.end"></td>
          <td>${types.length > 1 ? `<button class="x" type="button" aria-label="Премахни" title="Премахни" data-act="type-del" data-id="${i}">×</button>` : ""}</td></tr>`).join("")}
        </tbody></table></div>
        <div><button class="btn small" type="button" data-act="type-add">+ Вид смяна</button></div>
      </section>
      <section class="card" style="display:grid;gap:12px">
        <h2>Колеги</h2>
        <div class="list">${d.staff.filter(s => !s.archived).map(s => `<div class="li"><span class="dot" style="--cc:var(--c${(s.color ?? 0) % 6})"></span><input id="s-${esc(s.id)}-name" class="grow" aria-label="Име" style="background:transparent;border:0;font-weight:600;font-size:15px;padding:4px 0" value="${esc(s.name)}" data-path="staff.${d.staff.indexOf(s)}.name"><button class="btn small danger" type="button" data-act="staff-del" data-id="${esc(s.id)}">Премахни</button></div>`).join("") || `<p class="muted" style="margin:0">Още няма колеги.</p>`}</div>
        <div class="row"><input id="new-staff" placeholder="Име на колега" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1;min-width:0"><button class="btn small" type="button" data-act="staff-add">Добави</button></div>
      </section>
      <section class="card" style="display:grid;gap:12px">
        <div class="sec-head"><h2>Състезание</h2><label class="row" style="font-weight:600" for="k-on"><input id="k-on" type="checkbox" data-path="contest.on" data-bool ${k.on ? "checked" : ""}> Включено</label></div>
        <div class="grid2">
          <label class="field" for="k-title">Име<input id="k-title" value="${esc(k.title)}" placeholder="напр. Есенен шампионат" data-path="contest.title"></label>
          <label class="field" for="k-prize">Награда<input id="k-prize" value="${esc(k.prize)}" placeholder="напр. Ваучер за 50 €" data-path="contest.prize"></label>
          <label class="field" for="k-from">От<input id="k-from" type="date" value="${esc(k.from)}" data-path="contest.from"></label>
          <label class="field" for="k-to">До<input id="k-to" type="date" value="${esc(k.to)}" data-path="contest.to"></label>
          <label class="field" for="k-metric">Класиране по<select id="k-metric" data-path="contest.metric">${[["pct", "% изпълнение на целите за смените"], ["bonus", "изкаран бонус"], ["qty", "продадени бройки"]].map(([v, l]) => `<option value="${v}" ${k.metric === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        </div>
      </section>`;
  }

  function renderSavebar() {
    const slot = document.getElementById("savebar-slot");
    if (state.tab !== "manage" || !state.manager) { slot.innerHTML = ""; return; }
    slot.innerHTML = `<div class="savebar"><div class="savebar-in"><span class="muted" id="save-state">${state.dirty ? "Има незапазени промени" : "Всичко е запазено"}</span><div class="row"><button class="btn" type="button" data-act="discard" ${state.dirty ? "" : "disabled"}>Откажи</button><button class="btn primary" type="button" data-act="save" ${state.dirty ? "" : "disabled"}>Запази промените</button></div></div></div>`;
  }

  function render() {
    if (!state.cfg) return;
    const a = document.activeElement, focusId = a && a.id && a.closest?.("#app") ? a.id : null;
    const selS = focusId ? a.selectionStart : null, selE = focusId ? a.selectionEnd : null;
    renderHeader();
    const view = { shift: viewShift, board: viewBoard, schedule: viewSchedule, manage: viewManage }[state.tab] || viewShift;
    document.getElementById("app").innerHTML = banners() + view();
    renderSavebar();
    if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selS !== null) el.setSelectionRange(selS, selE); } catch {} } }
  }

  // ---------- events ----------
  function markDirty() {
    state.dirty = true;
    const s = document.getElementById("save-state"); if (s) s.textContent = "Има незапазени промени";
    document.querySelectorAll('.savebar [data-act]').forEach(b => b.disabled = false);
  }
  function setPath(obj, path, val) {
    const ks = path.split("."); let o = obj;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }

  document.getElementById("me-select").addEventListener("change", e => {
    state.me = e.target.value || null; state.seller = null; store.set("smena.me", state.me || ""); render();
  });

  const app = document.getElementById("app");
  app.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.path && state.draft) {
      const v = t.dataset.bool !== undefined ? t.checked : t.dataset.num !== undefined ? (parseFloat(t.value) || 0) : t.value;
      setPath(state.draft, t.dataset.path, v); markDirty();
    }
    if (t.dataset.sf && state.editingShift) { state.editingShift[t.dataset.sf] = t.value; refreshShiftSave(); }
  });
  app.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.path && t.tagName === "SELECT" && state.draft) { setPath(state.draft, t.dataset.path, t.value); markDirty(); }
    if (t.dataset.path && t.dataset.bool !== undefined && state.draft) { setPath(state.draft, t.dataset.path, t.checked); markDirty(); }
    if (t.dataset.sfstaff && state.editingShift) {
      const s = new Set(state.editingShift.staff);
      t.checked ? s.add(t.dataset.sfstaff) : s.delete(t.dataset.sfstaff);
      state.editingShift.staff = [...s]; refreshShiftSave();
    }
  });
  function refreshShiftSave() {
    const b = app.querySelector('[data-act="shift-save"]'), e = state.editingShift;
    if (b) b.disabled = !(e.staff.length && e.start < e.end);
  }
  app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "new-staff") { e.preventDefault(); act("staff-add"); } });

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    act(b.dataset.act, b.dataset.id, b);
  });

  async function act(a, id, el) {
    const c = state.cfg;
    switch (a) {
      case "pick": state.me = id; store.set("smena.me", id); state.seller = null; render(); break;
      case "seller": state.seller = id; render(); break;
      case "metric": state.boardMetric = id; render(); break;
      case "sell": {
        const p = prod(id), seller = state.seller || state.me;
        if (!p || !seller) return;
        fx.sale(el);
        const sh = myShiftToday(seller);
        const before = (() => { const g = goalsForDay(seller, TODAY); return { g, d: todayProgress(seller, g) }; })();
        const rec = { date: TODAY, ts: Date.now(), time: nowHM(), staffId: seller, productId: p.id, qty: 1, price: +p.price || 0, bonus: +p.bonus || 0, shiftId: sh?.id || null };
        try {
          const newId = await addSale(rec);
          toast(`${person(seller).name}: ${p.name} · +${money(p.bonus)}`, () => deleteSale(newId).catch(writeFailed));
          const after = todayProgress(seller, before.g);
          const key = TODAY + ":" + seller;
          if (before.g.total && before.d < before.g.total && after >= before.g.total && state.celebrated !== key) {
            state.celebrated = key; store.set("smena.celebrated", key);
            celebrate(person(seller).name, before.g.total);
            fx.big();
          }
        } catch (err) { writeFailed(err); }
        break;
      }
      case "unsell": deleteSale(id).catch(writeFailed); break;
      case "week": state.weekOffset = id === "0" ? 0 : state.weekOffset + Number(id); state.editingShift = null; render(); break;
      case "shift-add": {
        const used = new Set(state.shifts.filter(s => s.date === id).map(s => s.type));
        const t = c.shiftTypes.find(x => !used.has(x.id)) || c.shiftTypes[0];
        state.editingShift = { id: null, date: id, type: t.id, start: t.start, end: t.end, staff: [] };
        render(); break;
      }
      case "sf-type": {
        const t = shiftType(id), e = state.editingShift;
        if (t && e) { e.type = t.id; e.start = t.start; e.end = t.end; render(); }
        break;
      }
      case "shift-edit": { const s = state.shifts.find(x => x.id === id); state.editingShift = { ...s, staff: [...(s.staff || [])] }; render(); break; }
      case "shift-cancel": state.editingShift = null; render(); break;
      case "shift-save": {
        const e = state.editingShift; state.editingShift = null;
        try { await saveShift(e); toast("Смяната е запазена"); } catch (err) { writeFailed(err); }
        render(); break;
      }
      case "shift-del": { try { await deleteShift(id); toast("Смяната е изтрита"); } catch (err) { writeFailed(err); } break; }
      case "copy-week": {
        const ws = weekStart(state.weekOffset);
        const prev = state.shifts.filter(s => s.date >= addDays(ws, -7) && s.date < ws);
        try { for (const s of prev) await saveShift({ id: null, date: addDays(s.date, 7), type: s.type, start: s.start, end: s.end, staff: s.staff }); toast(`Копирах ${prev.length} смени`); } catch (err) { writeFailed(err); }
        render(); break;
      }
      case "template": state.draft.products = clone(TEMPLATE).map(p => ({ id: "p" + rid(), ...p })); markDirty(); render(); break;
      case "prod-add": state.draft.products.push({ id: "p" + rid(), name: "", price: 0, bonus: 0, targets: {} }); markDirty(); render(); break;
      case "type-add": state.draft.shiftTypes.push({ id: "t" + rid(), name: "Нова смяна", start: "09:00", end: "17:00" }); markDirty(); render(); break;
      case "type-del": {
        const t = state.draft.shiftTypes[Number(id)];
        if (state.shifts.some(s => s.type === t.id && s.date >= TODAY)) { toast(`В графика има бъдещи смени „${t.name}“. Смени им вида, преди да го премахнеш.`); return; }
        state.draft.shiftTypes.splice(Number(id), 1); markDirty(); render(); break;
      }
      case "prod-del": state.draft.products.splice(Number(id), 1); markDirty(); render(); break;
      case "staff-add": {
        const inp = document.getElementById("new-staff"); const name = inp.value.trim();
        if (!name) { inp.focus(); return; }
        const used = state.draft.staff.length;
        state.draft.staff.push({ id: "s" + rid(), name, color: used % 6 }); markDirty(); render();
        document.getElementById("new-staff")?.focus(); break;
      }
      case "staff-del": { const s = state.draft.staff.find(x => x.id === id); if (s) s.archived = true; markDirty(); render(); break; }
      case "discard": state.dirty = false; state.draft = null; render(); break;
      case "save": {
        const d = state.draft;
        d.products = d.products.filter(p => p.name.trim());
        if (d.shiftTypes.some(t => !t.name.trim() || !(t.start < t.end))) { toast("Всеки вид смяна трябва да има име и край след началото."); return; }
        if (d.contest.from > d.contest.to) { toast("Състезанието трябва да започва преди да свърши. Провери датите."); return; }
        try { await saveCfg(d); state.dirty = false; state.draft = null; toast("Промените са запазени"); maybeResubSales(); render(); } catch (err) { writeFailed(err); }
        break;
      }
    }
  }

  function route() {
    const h = location.hash.replace("#", "");
    state.tab = TABS.some(([k]) => k === h) ? h : "shift";
    if (state.tab === "manage" && !state.manager) state.tab = "shift";
    state.editingShift = null;
    render();
  }
  window.addEventListener("hashchange", route);

  // ---------- connect ----------
  function subSales(from) {
    if (unsubSales) unsubSales();
    salesFrom = from;
    unsubSales = DB.collection("sales").where("date", ">=", from).onSnapshot(q => {
      state.sales = q.docs.map(d => ({ id: d.id, ...d.data() })); render();
    }, onErr);
  }
  function maybeResubSales() {
    if (state.mode !== "live") return;
    const k = state.cfg.contest;
    const want = k.on && k.from && k.from < MONTH_START ? k.from : MONTH_START;
    if (want !== salesFrom) subSales(want);
  }
  function onErr(e) { if (e?.code === "revoked") { state.canWrite = false; render(); } }

  async function connect() {
    const claude = window.claude;
    const offline = () => { state.mode = "offline"; state.manager = true; render(); };
    if (!claude?.use) { offline(); return; }
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) { offline(); return; }
    DB = db;
    state.manager = (await user?.isOwner()) ?? false;
    const cw = user ? await user.can("data.write") : null;
    state.canWrite = cw !== false;
    let first = true;
    DB.doc("cfg/main").onSnapshot(s => {
      const wasDemo = state.mode !== "live";
      state.mode = "live";
      state.cfg = normCfg(s.exists ? s.data() : null);
      if (wasDemo) { state.shifts = []; state.sales = []; state.me = store.get("smena.me"); }
      if (first) {
        first = false; maybeResubSales(); if (!salesFrom) subSales(MONTH_START);
        DB.collection("cfg/main/shifts").where("date", ">=", PREV_MONTH_START).onSnapshot(q => {
          state.shifts = q.docs.map(d => ({ id: d.id, ...d.data() })); render();
        }, onErr);
      } else maybeResubSales();
      route();
    }, onErr);
  }

  loadDemo();
  state.manager = false;
  route();
  connect().catch(() => { state.mode = "offline"; state.manager = true; render(); });
})();
</script>
